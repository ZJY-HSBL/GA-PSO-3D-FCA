name: tests-and-diagnostics
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[test]'
      - name: Numerical regression suite
        run: pytest -q
      - name: Re-run first-stage diagnostic (computed figures and metrics)
        run: python -m gapso_fca.research --n 25 --steps 20 --out results/conservative_flux
      - name: Upload generated diagnostic figures and data
        uses: actions/upload-artifact@v4
        with:
          name: conservative-flux-diagnostics
          path: results/conservative_flux/
          if-no-files-found: error
